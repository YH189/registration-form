<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
  </head>
  <body>
    <h1>Registration Form</h1>
    <form action="index.php" method="post">
      <label for="Username">Username</label> <br />
      <input
        type="text"
        id="Username"
        name="Username"
        placeholder="Enter Username"
        required
      />
      <br />
      <label for="email">Email</label> <br />
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your mail"
        required
      />
      <br />
      <label for="Password">Password</label><br />
      <input
        type="password"
        id="Password"
        name="Password"
        placeholder="Enter your password"
        minlength="8"
        required
      />
      <br />
      <label for="tel">Phone number</label> <br />
      <input
        type="tel"
        id="tel"
        name="tel"
        placeholder="91+"
        pattern="[0-9]{10}"
        maxlength="10"
        required
      /><br />
      <label for="Birthday">Birthday</label><br />
      <input type="date" id="Birthday" name="Birthday" required /><br />
      <label for="Quantity">Quantity</label> <br />
      <input type="number" id="Quantity" name="Quantity" min="1" /><br />
      <label for="title">Title:</label>
      <label for="Mr">Mr</label>
      <input type="radio" id="Mr" value="Mr" name="Title" />
      <label for="Ms">Ms</label>
      <input type="radio" id="Ms" value="Ms" name="Title" />
      <label for="Phd">Phd</label>
      <input type="radio" id="Phd" value="Phd" name="Title" /> <br />
      <label for="payment">Payment:</label>
      <select id="payment" name="payment">
        <option value="Visa">Visa</option>
        <option value="UPI">UPI</option>
        <option value="Card">Card</option>
        <option value="EMI">EMI</option>
      </select>
      <br />
      <label for="Subscribe">Subscribe</label>
      <input type="checkbox" id="Subscribe" name="Subscribe" /><br />
      <label for="File">File:</label>
      <input type="file" id="File" name="File" /><br />

      <label for="comment">Comment:</label><br />
      <textarea id="comment" name="comment" rows="3" cols="25"></textarea>
      <br />
      <input type="reset" /> <br />
      <input type="submit" />
    </form>
  </body>
</html>
